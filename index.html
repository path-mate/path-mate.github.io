.lovebars .lr{position:relative; height:20px; background:#F0ECE0; border-radius:99px; overflow:hidden}
.lovebars .lr .a{position:absolute; top:0; bottom:0; right:0; background:rgba(31,78,67,.7)}
.lovebars .lr .b{position:absolute; top:0; bottom:0; right:0; background:repeating-linear-gradient(45deg,rgba(200,162,75,.55),rgba(200,162,75,.55) 4px,transparent 4px,transparent 8px)}

.advice{border-inline-start:3px solid var(--teal); background:#F1F8F6; border-radius:10px; padding:11px 13px; margin-bottom:9px; font-size:13.5px; line-height:2}
.advice.warn{border-inline-start-color:var(--gold); background:#FBF6E8}
.advice .h{font-weight:800; font-size:13px; margin-bottom:2px; display:block}

nav#bnav{position:fixed; bottom:0; right:0; left:0; z-index:50; background:var(--navbg); border-top:1px solid var(--line);
  display:flex; justify-content:space-around; padding:7px 2px calc(7px + env(safe-area-inset-bottom))}
nav#bnav button{flex:1; max-width:110px; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10px; font-weight:700; color:#93A199; border-radius:12px; padding:5px 1px}
nav#bnav button svg{width:21px; height:21px}
nav#bnav button.on{color:var(--green); background:#EDF4F0}
nav#bnav button.hide{display:none}

#toast{position:fixed; bottom:calc(86px + env(safe-area-inset-bottom)); right:50%; transform:translateX(50%) translateY(14px);
  background:var(--green2); color:#F6F2E9; border-radius:99px; padding:9px 20px; font-size:13.5px; font-weight:600;
  opacity:0; pointer-events:none; transition:all .25s; z-index:60; box-shadow:0 8px 22px rgba(0,0,0,.22); max-width:88vw; text-align:center}
#toast.show{opacity:1; transform:translateX(50%) translateY(0)}
#modal{position:fixed; inset:0; background:rgba(24,34,29,.45); display:none; align-items:center; justify-content:center; z-index:70; padding:24px}
#modal.show{display:flex}
#modal .box{background:#fff; border-radius:18px; padding:20px 18px; max-width:340px; width:100%; box-shadow:0 18px 50px rgba(0,0,0,.3)}
#modal .box p{margin:0 0 16px; font-size:14.5px; font-weight:600; line-height:2}
#modal .btnrow{justify-content:flex-end}
.footer-note{text-align:center; font-size:11px; color:#A7B0A9; margin:18px 0 6px; line-height:1.9}

@media (min-width:520px){ .rates{gap:9px} .brand h1{font-size:30px} }
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }

/* ---- فیلتر بی‌پاسخ‌ها ---- */
.filtbar{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin:2px 2px 12px}
.filtchip{border:1.5px solid var(--line); background:var(--card); border-radius:99px; padding:8px 15px;
  font-size:13px; font-weight:700; color:var(--muted); box-shadow:var(--shadow)}
.filtchip.on{background:var(--teal); color:#fff; border-color:transparent}
.alldone{background:var(--card); border:1px solid #CBE3D8; border-radius:var(--radius); padding:22px 16px;
  text-align:center; box-shadow:var(--shadow); margin-bottom:12px}
.alldone .em{font-size:40px; display:block; margin-bottom:6px}
.alldone b{font-size:15px; display:block; margin-bottom:4px}


/* ---- راهنمای پیش از شروع ---- */
.guidebox{background:var(--card); border:1px solid #EED0D8; border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden}
.guidebox>summary{list-style:none; cursor:pointer; padding:14px 16px; font-size:15.5px; font-weight:800;
  display:flex; align-items:center; gap:8px; background:#FDF6F8; color:#8A2F49}
.guidebox>summary::-webkit-details-marker{display:none}
.guidebox>summary .ar{margin-inline-start:auto; font-size:12px; font-weight:700; opacity:.75}
.guidebox[open]>summary .ar::after{content:'بستن ▲'}
.guidebox:not([open])>summary .ar::after{content:'نمایش ▼'}
.guidebox .gin{padding:4px 16px 16px}
.gitem{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px dashed var(--line)}
.gitem:last-child{border-bottom:none}
.gitem .gi{flex:0 0 auto; font-size:18px; line-height:1.7}
.gitem b{display:block; font-size:14px; margin-bottom:2px}
.gitem span.gt{font-size:13px; color:var(--muted); line-height:1.95}


/* ---- بخش‌بندِ بی‌پرده ---- */
.frankdiv{background:linear-gradient(160deg,#FDF3F6,#FBEAF0); border:1.5px solid #EEC6D2;
  border-radius:var(--radius); padding:16px 17px; margin:6px 0 14px; box-shadow:var(--shadow)}
.frankdiv .fh{display:flex; align-items:center; gap:9px; font-family:'Lalezar',cursive; font-weight:400;
  font-size:21px; color:#8A2F49; line-height:1.4; margin-bottom:8px}
.frankdiv p{margin:0 0 10px; font-size:14px; line-height:2.05; color:#4a3540}
.frankdiv .hard{background:#fff; border-inline-start:4px solid var(--rose); border-radius:11px;
  padding:11px 13px; margin:12px 0; font-size:14px; line-height:2; color:#8A2F49}
.frankdiv ul{margin:10px 0 0; padding:0; list-style:none}
.frankdiv li{font-size:13.5px; line-height:1.95; padding:7px 0; border-bottom:1px dashed #EEC6D2; color:#4a3540}
.frankdiv li:last-child{border-bottom:none}
.frankdiv li b{color:#8A2F49}
.frankdiv .starter{margin-top:12px; background:#fff; border:1px dashed #E0A9BC; border-radius:11px;
  padding:11px 13px; font-size:13.5px; line-height:2; color:#6b4553}


/* ---- متن‌های خواندنی ---- */
.readintro{margin-top:14px; font-size:13.5px; font-weight:700; color:#8A2F49; line-height:1.95}
.rcard{border-radius:14px; margin-top:9px; overflow:hidden; border:1.5px solid #EEC6D2; background:#fff}
.rcard.m{border-color:#CBE3D8}
.rcard>summary{list-style:none; cursor:pointer; padding:12px 14px; font-size:14px; font-weight:800;
  display:flex; align-items:center; gap:8px; color:#8A2F49; background:#FDF3F6}
.rcard.m>summary{color:var(--green); background:#EFF6F2}
.rcard>summary::-webkit-details-marker{display:none}
.rcard>summary .em2{font-size:19px}
.rcard>summary .ar2{margin-inline-start:auto; font-size:11.5px; font-weight:700; opacity:.7}
.rcard[open]>summary .ar2::after{content:'بستن ▲'}
.rcard:not([open])>summary .ar2::after{content:'بخوان ▼'}
.rtext{padding:6px 15px 15px; font-size:14.5px; line-height:2.25; color:#33404a}
.rtext p{margin:0 0 11px}
.rtext p:last-child{margin-bottom:0}
.rtext .sign{margin-top:12px; font-size:12.5px; color:var(--muted); border-top:1px dashed var(--line); padding-top:9px}


/* ---- فهرست بخش‌ها در صفحه‌ی خانه ---- */
.infolist{margin-top:2px}
.ii{display:flex; gap:11px; align-items:flex-start; padding:12px 0; border-bottom:1px dashed var(--line)}
.ii:last-child{border-bottom:none}
.ii .ic{flex:0 0 26px; font-size:20px; line-height:1.7; text-align:center}
.ii .tx{flex:1; min-width:0}
.ii .tx b{display:block; font-size:15px; color:var(--green); margin-bottom:3px}
.ii .tx span{display:block; font-size:13.5px; color:var(--muted); line-height:2.1}


/* ---- آزمون هوش ---- */
.iqrow{margin-top:11px}
.iqrow .who{display:inline-block; font-size:12px; font-weight:800; color:var(--green);
  background:#EDF4F0; border-radius:8px; padding:4px 12px; margin-bottom:7px}
.iqrow .who.b{color:#7A5A16; background:#F7F0DC}
.iqopt{display:block; width:100%; text-align:right; border:1.5px solid var(--line); background:var(--opt);
  border-radius:11px; padding:11px 13px; margin-bottom:7px; font-size:14px; font-weight:600; color:var(--ink); line-height:1.8}
.iqopt.sel{border-color:var(--green); background:#EDF4F0}
.iqopt.sel.b{border-color:var(--gold); background:#F7F0DC}
.iqopt.ok{border-color:#5E8F63; background:#EAF5EC; color:#2F5D37}
.iqopt.bad{border-color:var(--pom); background:#FBEEEC; color:#8E332B}
.iqkey{font-size:12px; color:var(--muted); margin-top:9px; line-height:1.9}
.iqres{display:flex; gap:10px; margin:8px 0 4px}
.iqres .box{flex:1; border:1.5px solid var(--line); border-radius:14px; padding:12px; text-align:center}
.iqres .box .who{font-size:11.5px; color:var(--muted); font-weight:700}
.iqres .box .sc{font-family:'Lalezar',cursive; font-size:30px; line-height:1.2; color:var(--green)}
.iqres .box.b .sc{color:var(--gold)}


/* ---- هشدار ابتدای آشنایی ---- */
.earlybox{background:#FBF6E8; border:1.5px solid #E4D3A0; border-radius:13px; padding:13px 15px; margin:12px 0}
.earlybox .eh{font-weight:800; font-size:14.5px; color:#7A6320; margin-bottom:6px; display:flex; align-items:center; gap:7px}
.earlybox p{margin:0 0 8px; font-size:13.5px; line-height:2.05; color:#6E5A1E}
.earlybox p:last-child{margin-bottom:0}


/* ---- توصیه‌ی پایانی بخش زناشویی ---- */
.finaladv{background:var(--card); border:1.5px solid var(--line); border-inline-start:4px solid var(--teal);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 17px; margin:16px 0 6px}
.finaladv h3{margin:0 0 8px; font-size:16px; display:flex; align-items:center; gap:8px}
.finaladv .lead{font-size:13.5px; color:var(--muted); line-height:2.05; margin:0 0 12px}
.finaladv .blk{border-top:1px dashed var(--line); padding:11px 0 2px}
.finaladv .blk b{display:block; font-size:14.5px; color:var(--green); margin-bottom:4px}
.finaladv .blk p{margin:0 0 7px; font-size:13.5px; line-height:2.05}
.finaladv .rule{background:#F1F8F6; border-radius:11px; padding:11px 13px; margin-top:12px; font-size:13.5px; line-height:2.05}
.finaladv .rule b{color:var(--teal)}


/* ---- آموزش سکس ---- */
.edusec{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:11px; overflow:hidden}
.edusec>summary{list-style:none; cursor:pointer; padding:14px 15px; font-size:15px; font-weight:800;
  display:flex; align-items:center; gap:9px; color:var(--green); background:#F4F8F5}
.edusec>summary::-webkit-details-marker{display:none}
.edusec>summary .n{flex:0 0 26px; height:26px; border-radius:50%; background:var(--teal); color:#fff;
  font-size:13px; display:flex; align-items:center; justify-content:center; font-family:'Lalezar',cursive; font-weight:400}
.edusec>summary .ar3{margin-inline-start:auto; font-size:11.5px; font-weight:700; opacity:.65}
.edusec[open]>summary .ar3::after{content:'▲'} .edusec:not([open])>summary .ar3::after{content:'▼'}
.edubody{padding:6px 16px 16px}
.edubody h4{font-size:14.5px; margin:14px 0 6px; color:var(--green2)}
.edubody h4:first-child{margin-top:6px}
.edubody p{margin:0 0 9px; font-size:14px; line-height:2.15}
.edubody ul{margin:0 0 10px; padding:0; list-style:none}
.edubody li{font-size:14px; line-height:2.1; padding:6px 0 6px 0; border-bottom:1px dashed var(--line); position:relative; padding-inline-start:16px}
.edubody li:last-child{border-bottom:none}
.edubody li::before{content:'•'; position:absolute; inset-inline-start:2px; color:var(--teal2); font-weight:800}
.edubody li b, .edubody p b{color:var(--green2)}
.edunote{background:#FBF6E8; border:1px solid #EADFBE; border-radius:11px; padding:11px 13px; margin:10px 0; font-size:13.5px; line-height:2.05; color:#6E5A1E}
.eduwarn{background:#FBEEEC; border-inline-start:4px solid var(--pom); border-radius:11px; padding:11px 13px; margin:10px 0; font-size:13.5px; line-height:2.05; color:#8E332B}
.edukey{background:#F1F8F6; border-inline-start:4px solid var(--teal); border-radius:11px; padding:11px 13px; margin:10px 0; font-size:13.5px; line-height:2.05}



/* ---- (حذف‌شده) ---- */
.heatcard{background:linear-gradient(160deg,#FDF3F6,#FBEAF0); border:1.5px solid #EEC6D2;
  border-radius:var(--radius); box-shadow:var(--shadow); padding:17px 18px; margin:18px 0 6px}
.heatcard h3{margin:0 0 10px; font-family:'Lalezar',cursive; font-weight:400; font-size:21px; color:#8A2F49;
  display:flex; align-items:center; gap:9px; line-height:1.4}
.heatcard p{margin:0 0 11px; font-size:14px; line-height:2.15; color:#4a3540}
.heatcard p:last-child{margin-bottom:0}
.heatcard .big{background:#fff; border-inline-start:4px solid var(--rose); border-radius:12px;
  padding:12px 14px; margin:12px 0; font-size:14.5px; line-height:2.1; color:#8A2F49}
.heatcard ul{margin:10px 0 0; padding:0; list-style:none}
.heatcard li{font-size:13.8px; line-height:2.05; padding:8px 0; border-bottom:1px dashed #EEC6D2; color:#4a3540}
.heatcard li:last-child{border-bottom:none}
.heatcard li b{color:#8A2F49}


/* ---- توضیح تحریک پیش از ازدواج ---- */
.waitbox{background:#F1F8F6; border:1.5px solid #C6E0D6; border-radius:13px; padding:13px 15px; margin:12px 0}
.waitbox .wh{font-weight:800; font-size:14.5px; color:var(--teal); margin-bottom:6px; display:flex; align-items:center; gap:7px}
.waitbox p{margin:0 0 9px; font-size:13.5px; line-height:2.05; color:#2f4a44}
.waitbox p:last-child{margin-bottom:0}
.waitbox b{color:var(--green2)}


/* ---- پیام پایانی ---- */
.byecard{background:linear-gradient(160deg,#FDF3F6,#FBEAF0); border:1.5px solid #EEC6D2;
  border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin:18px 0 6px}
.byecard h3{margin:0 0 12px; font-family:'Lalezar',cursive; font-weight:400; font-size:22px; color:#8A2F49;
  display:flex; align-items:center; gap:9px; line-height:1.4}
.byecard p{margin:0 0 12px; font-size:14.2px; line-height:2.2; color:#43323c}
.byecard p:last-child{margin-bottom:0}
.byecard .scale{background:#fff; border-inline-start:4px solid var(--rose); border-radius:12px;
  padding:13px 15px; margin:14px 0; font-size:14px; line-height:2.15; color:#8A2F49}
.byecard .warn{background:#FFF2F2; border:2px solid #E5A9A9; border-radius:12px; padding:14px 15px; margin:14px 0}
.byecard .warn .wt{display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; color:#B3120C; margin-bottom:7px}
.byecard .warn p{color:#A81E17; font-size:13.8px; line-height:2.15; margin-bottom:9px}
.byecard .warn p:last-child{margin-bottom:0}
.byecard .sign{text-align:center; font-family:'Lalezar',cursive; font-weight:400; font-size:19px;
  color:#8A2F49; line-height:1.9; margin-top:16px}
.linkspot{border:2px dashed #C9D6CC; border-radius:12px; padding:13px; margin:14px 0; text-align:center; background:#F7FAF8}
.linkspot .ls{font-size:12.5px; color:var(--muted); line-height:1.95}
.linkspot a.btn{text-decoration:none}


/* ---- راهنمای ترجمه ---- */
.trbox{background:#fff; border:1.5px solid #E4DCCB; border-radius:13px; padding:14px 15px; margin:14px 0}
.trbox .th{font-weight:800; font-size:14.5px; color:var(--green); margin-bottom:4px; display:flex; align-items:center; gap:8px}
.trbox .sub2{font-size:12.5px; color:var(--muted); line-height:1.95; margin-bottom:10px}
.trgrp{border-top:1px dashed var(--line); padding-top:10px; margin-top:10px}
.trgrp:first-of-type{border-top:none; padding-top:0; margin-top:0}
.trgrp b{display:block; font-size:13.5px; color:var(--green2); margin-bottom:5px}
.trgrp p{margin:0 0 7px; font-size:13.3px; line-height:2.05; color:#3c4a43}
.trgrp p:last-child{margin-bottom:0}
.trgrp .k{background:#EDF4F0; border-radius:6px; padding:1px 7px; font-weight:700; color:var(--green); white-space:nowrap}


/* ---- اجزای جدید: دکمه‌ی تم، ردِ ثبت‌شده، هشدار حساس، دروازه‌ها، ایمنی ---- */
.skipbtn{margin-top:9px; border:1.5px dashed var(--line); background:transparent; color:var(--muted);
  border-radius:10px; padding:7px 12px; font-size:12.5px; font-weight:700}
.skipbtn.on{border-style:solid; border-color:#E4D3A0; background:#FBF6E8; color:#7A6320}
.qcard.skipped{border-inline-start-color:var(--gold); opacity:.93}
.sens-note{margin-top:9px; background:#FDEDEA; border:1px solid #F1C7C0; color:#9C3A32;
  border-radius:10px; padding:8px 11px; font-size:12.3px; line-height:1.95}
.gate{background:var(--card); border:1.5px solid #EEC6D2; border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px; margin:8px 0 14px}
.gate h4{margin:0 0 8px; font-size:15.5px; color:#8A2F49; display:flex; gap:8px; align-items:center}
.gate ol{margin:0 0 12px; padding-inline-start:18px}
.gate li{font-size:13.5px; line-height:2.05; color:#4a3540; margin-bottom:4px}
.stepdiv{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:linear-gradient(160deg,#FDF3F6,#FBEAF0);
  border:1.5px solid #EEC6D2; border-radius:14px; padding:12px 15px; margin:6px 0 12px; font-weight:800; color:#8A2F49}
.sf{flex:1; height:40px; border:1.5px solid var(--line); border-radius:11px; background:var(--opt);
  font-weight:800; font-size:13.5px; color:var(--muted)}
.sf.on{color:#fff; border-color:transparent}
.sf.on.y{background:var(--pom)} .sf.on.n{background:var(--teal)} .sf.on.x{background:#8A8F8B}

.steprules{padding:14px 16px}
.steprules>summary{list-style:none; cursor:pointer; font-size:14.5px; color:#8A2F49; margin-bottom:9px}
.steprules>summary::-webkit-details-marker{display:none}
.steprules:not([open])>summary{margin-bottom:0}
html[data-theme="dark"] .steprules>summary{color:#F3C6D2}

.wtotal{display:flex; align-items:center; justify-content:space-between; background:var(--track);
  border-radius:12px; padding:11px 14px; font-weight:800}
.wtotal b{font-family:'Lalezar',cursive; font-weight:400; font-size:21px; color:var(--green)}
.wrow{margin-bottom:13px}
.wrow .wh{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; font-size:13.5px}
.wrow .wh b{font-size:14.5px}
.wrow .wh span{color:var(--muted); font-size:12.5px; font-weight:700}
.wrow .bar{height:9px; background:var(--track); border-radius:99px; overflow:hidden}
.wrow .bar i{display:block; height:100%; border-radius:99px}
.wrow p.small{margin:5px 0 0}
html[data-theme="dark"] .wtotal b{color:var(--teal2)}

/* ---- بخش‌های تاشوی نتایج ---- */
.rsec{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); margin-bottom:11px; overflow:hidden}
.rsec>summary{list-style:none; cursor:pointer; padding:14px 16px; font-size:15.5px; font-weight:800;
  display:flex; align-items:center; gap:9px}
.rsec>summary::-webkit-details-marker{display:none}
.rsec>summary .em{font-size:18px}
.rsec>summary .ar4{margin-inline-start:auto; font-size:11.5px; font-weight:700; color:var(--muted)}
.rsec[open]>summary{border-bottom:1px dashed var(--line)}
.rsec[open]>summary .ar4::after{content:'بستن ▲'}
.rsec:not([open])>summary .ar4::after{content:'نمایش ▼'}
.rsec .rin{padding:14px 16px 16px}
.srow .snum.t{background:var(--gold)}

/* ---- پاسخ پنهان آزمون هوش ---- */
.iqhide{display:flex; align-items:center; gap:10px; flex-wrap:wrap; border:1.5px dashed var(--line);
  background:var(--opt); border-radius:11px; padding:10px 12px; font-size:13px; color:var(--muted)}

.agebox{text-align:start; font-size:13.2px; line-height:2.1; background:#FCEDEA; border:1.5px solid #E6A79C;
  border-radius:12px; padding:12px 14px}
.agebox p{margin:0 0 8px; color:#7E241B}
.agebox ul{margin:0 0 8px; padding-inline-start:18px}
.agebox li{margin-bottom:4px; color:#5E1A13; font-weight:600}
.agebox b{color:#8E2A20}
.agebox .q{background:#fff; border:1px solid #E6A79C; border-radius:10px; padding:9px 11px; margin:0; color:#7E241B; font-weight:700}
html[data-theme="dark"] .agebox{background:#241A18; border-color:#7A4038}
html[data-theme="dark"] .agebox p,html[data-theme="dark"] .agebox .q{color:#F3C3BA}
html[data-theme="dark"] .agebox li{color:#F8D6CF}
html[data-theme="dark"] .agebox b{color:#FFB4A8}
html[data-theme="dark"] .agebox .q{background:#1A1413; border-color:#7A4038}

 'سابقه‌ی بیماری مقاربتی (تبخال تناسلی، اچ‌پی‌وی، هپاتیت، سوزاک و…) در هرکدام‌مان بوده است؟ اگر بوده، درمان شده و آیا احتمال انتقالش هست؟',
 'اگر بخواهیم درباره‌ی تعداد تجربه‌های دخولِ پیشین هرکدام‌مان حرف بزنیم، آیا اصلاً می‌خواهیم بدانیم؟ و اگر بله، این عدد قرار است چه چیزی را برایمان روشن کند؟',
 'به‌تعویق‌انداختن بچه‌دار شدن برای اینکه چند سال اول را با آرامش و لذت بیشتری کنار هم باشیم: نظر هرکدام‌مان چیست و چند سال؟',
 'نظرمان درباره‌ی جراحی ترمیم بکارت چیست — از نظر پزشکی، اخلاقی و از نظر تأثیرش بر اعتماد بین خودمان؟',
 'اگر بخواهیم رابطه بدون کاندوم باشد و انزال داخل انجام شود ولی بارداری نخواهیم، دقیقاً از چه روشی استفاده می‌کنیم و مسئولیت و ریسکش با کیست؟',
 'در سفری که با هم می‌رویم، اگر موقعیت رابطه‌ی سه‌نفره با یک غریبه پیش بیاید — کسی که فقط همان یک شب است و بعدش هیچ دسترسی و ارتباطی با او نداریم، چه زن باشد چه مرد، از جمله سکس‌ورکر — نظر قطعی هرکدام‌مان چیست؟');

      <h4>چرا این‌همه پرسش؟</h4>
      <p>جدایی‌ها معمولاً سرِ یک موضوع بزرگ اتفاق نمی‌افتند؛ سرِ ده‌ها موضوع کوچکِ هیچ‌وقت گفته‌نشده اتفاق می‌افتند: سقف خرج بدون مشورت، مهمانی آخر هفته، والدین سالمند، ساعت خواب، تنهایی، بچه، دین، و حتی دمای کولر. هر پرسشی که از این فهرست حذف می‌شد، یک دعوای احتمالیِ آینده بود که کشف‌نشده می‌ماند.</p>

const W_LABEL={3:'حیاتی',2:'مهم',1:'سلیقه‌ای'};
const W_DESC={3:'موضوع‌هایی که اختلاف در آن‌ها معمولاً با زمان حل نمی‌شود و می‌تواند مسیر زندگی را عوض کند.',

 1:'سلیقه و ذائقه؛ اختلاف در این‌ها طبیعی است و به‌تنهایی نشانه‌ی ناسازگاری نیست.'};
const TOPIC_W={goals:3,values:3,faith:3,commit:3,trust:3,money:3,legal:3,health:3,mind:3,power:3,kids:3,conflict:3,
 know:2,past:2,crisis:2,roles:2,home:2,career:2,comm:2,family:2,love:2,custom:2,
 life:1,leisure:1,tech:1,fun:1};
/* استثناها: پرسش‌هایی که وزن‌شان با موضوع‌شان فرق دارد */
const QW_OVER={ life_16:3, life_15:2, life_20:2, life_21:2, health_14:2, career_14:2, career_15:3,
 money_21:2, money_22:1, mind_15:2, life_22:1, life_23:2, life_24:1, mind_16:2, mind_17:2, mind_18:2, money_23:2, money_24:3, money_25:3, kids_18:3, kids_19:3, values_15:1, conflict_15:2, faith_11:3, faith_12:3, values_14:2, values_15:2, values_16:1,
 leisure_11:2, leisure_13:2, mind_12:2, mind_13:2, mind_14:2,
 family_15:3, family_16:3, home_12:3, tech_3:2, tech_7:2 };
function qWeight(id){ if(QW_OVER[id]) return QW_OVER[id];
  const t=(id.indexOf('c_')===0)?'custom':String(id).split('_')[0]; return TOPIC_W[t]||2; }
function weightedStats(){
  const T={3:{n:0,s:0},2:{n:0,s:0},1:{n:0,s:0}}; let ws=0, wt=0;
  activeTopics().forEach(t=>t.qs.forEach(q=>{ const v=aVal(q.id); if(!v)return;
    const w=qWeight(q.id); T[w].n++; T[w].s+=v; ws+=w*v; wt+=w*5; }));
  const p=(s,n)=>n?Math.round((((s/n)-1)/4)*100):null;
  return { overall: wt? Math.round(((((ws/wt)*5)-1)/4)*100) : null,
    tiers:[3,2,1].map(w=>({w,label:W_LABEL[w],desc:W_DESC[w],n:T[w].n,pct:p(T[w].s,T[w].n)})) };
}
function lightTopicStats(){ return activeTopics().filter(t=>t.qs.length&&(TOPIC_W[t.id]||2)===1).map(t=>{
    let n=0,s=0; t.qs.forEach(q=>{ const v=aVal(q.id); if(v){n++;s+=v;} });
    return {t, n, pct: n? Math.round((((s/n)-1)/4)*100) : null }; }).filter(x=>x.n); }
function weightCardHTML(){
  const W=weightedStats(); if(W.overall==null) return '';
  const rows=W.tiers.map(x=>`<div class="wrow">
      <div class="wh"><b>${x.label}</b><span>${x.pct==null?'—':fmt(x.pct)+'٪'} · ${fmt(x.n)} پرسش</span></div>
      <div class="bar"><i style="width:${x.pct||0}%;background:${x.pct==null?'var(--track)':barColor(x.pct)}"></i></div>
      <p class="small">${x.desc}</p></div>`).join('');
  const L=lightTopicStats();
  const chart=L.length?`<div style="margin-top:12px"><b style="font-size:13.5px">📈 نمودار پرسش‌های سلیقه‌ای</b>
      <p class="small" style="margin:4px 0 8px">این‌ها همان‌هایی‌اند که «چه رنگی، چه سریالی، چه سفری» را می‌پرسند. پایین‌بودن‌شان نگران‌کننده نیست؛ فقط نشان می‌دهد کجا ذائقه‌تان فرق دارد.</p>
      ${L.map(x=>`<div class="tres"><div class="tt"><span>${x.t.icon} ${x.t.title}</span><span>${fmt(x.pct)}٪</span></div>
        <div class="bar"><i style="width:${x.pct}%;background:${barColor(x.pct)}"></i></div></div>`).join('')}</div>`:'';
  return rsec('⚖️','تفاهم به تفکیک اهمیت',`
    <p class="sub">همه‌ی پرسش‌ها هم‌وزن نیستند. اختلاف بر سر «سبک موسیقی» با اختلاف بر سر «بچه می‌خواهیم یا نه» یکی نیست، ولی در میانگین ساده هر دو یک اثر دارند. این‌جا هر گروه جدا حساب شده است.</p>
    <div class="wtotal"><span>تفاهم وزنی کل</span><b>${fmt(W.overall)}٪</b></div>
    <p class="small" style="margin:6px 0 12px">در این عدد، پرسش‌های حیاتی سه برابر و پرسش‌های مهم دو برابرِ پرسش‌های سلیقه‌ای اثر دارند.</p>
    ${rows}${chart}`);
}

function mbtiScore(who){
  const ax={EI:[0,0],SN:[0,0],TF:[0,0],JP:[0,0]}; // [pole1sum, count]
  const map={EI:'E',SN:'S',TF:'T',JP:'J'};
  let n=0;
  TESTS.mbti.items.forEach(it=>{ const v=(S.pers[it.id]||{})[who]; if(!v)return; n++;
    const toward=(v-3); const first=map[it.ax];
    ax[it.ax][0]+= it.pole===first? toward : -toward; ax[it.ax][1]++; });
  if(!n) return null;
  const letter={}; const strength={};
  Object.keys(ax).forEach(k=>{ const first=map[k]; const other={EI:'I',SN:'N',TF:'F',JP:'P'}[k];
    const s=ax[k][0]; letter[k]= s>=0? first : other;
    const cnt=ax[k][1]||1; strength[k]=Math.min(100,Math.round(Math.abs(s)/(cnt*2)*100)); });
  const code=letter.EI+letter.SN+letter.TF+letter.JP;
  return {code, letter, strength, answered:n, total:TESTS.mbti.items.length};
}
function big5Score(who){
  const acc={}; Object.keys(DIMS_BIG).forEach(d=>acc[d]={s:0,n:0});
  TESTS.big5.items.forEach(it=>{ const v=(S.pers[it.id]||{})[who]; if(!v)return; acc[it.dim].s+= it.rev?6-v:v; acc[it.dim].n++; });
  const r={}; let n=0; Object.keys(DIMS_BIG).forEach(d=>{ r[d]=acc[d].n?acc[d].s/acc[d].n:null; if(acc[d].n)n+=acc[d].n; });
  r._n=n; return r;
}
function attachScore(who){
  let anxS=0,anxN=0,avoS=0,avoN=0;
  TESTS.attach.items.forEach(it=>{ const v=(S.pers[it.id]||{})[who]; if(!v)return;
    if(it.dim==='anx'){anxS+=v;anxN++;} else {avoS+=v;avoN++;} });
  if(!anxN&&!avoN)return null;
  const anx=anxN?anxS/anxN:null, avo=avoN?avoS/avoN:null;
  let style='—';
  if(anx!=null&&avo!=null){ const hiA=anx>=3, hiV=avo>=3;
    style= !hiA&&!hiV?'ایمن' : hiA&&!hiV?'مضطرب' : !hiA&&hiV?'اجتنابی' : 'هراسان'; }
  return {anx,avo,style, answered:anxN+avoN, total:TESTS.attach.items.length};
}
function loveScore(who){
  const acc={}; Object.keys(LOVE_LABELS).forEach(k=>acc[k]={s:0,n:0});
  TESTS.love.items.forEach(it=>{ const v=(S.pers[it.id]||{})[who]; if(!v)return; acc[it.dim].s+=v; acc[it.dim].n++; });
  const r={}; let n=0; Object.keys(LOVE_LABELS).forEach(k=>{ r[k]=acc[k].n?acc[k].s/acc[k].n:null; if(acc[k].n)n+=acc[k].n; });
  const ranked=Object.keys(LOVE_LABELS).filter(k=>r[k]!=null).sort((x,y)=>r[y]-r[x]);
  r._n=n; r._ranked=ranked; return r;
}

function renderTopics(){
  const st=stats(); const only=S.ui.qFilter==='un';
  const rows=st.per.filter(t=> t.id==='custom' || !only || t.answered<t.total ).map(t=>topicRow(t, t.id==='custom'));
  const fd=FINALE.filter((_,i)=>S.finale['f'+(i+1)]).length; const fw=Math.round(fd/FINALE.length*100);
  if(!(only && fd>=FINALE.length)) rows.push(`<button class="trow ${fd>=FINALE.length?'donez':''}" data-act="open" data-topic="finale">
    <span class="ic">🎁</span>
    <span class="tt"><b>حسن ختام <span class="tag teal">بدون نمره</span></b><span class="bar"><i style="width:${fw}%"></i></span></span>
    <span class="pr">${fd>=FINALE.length?'✓ ':''}${fmt(fd)}/${fmt(FINALE.length)}</span>
    <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>`);
  const body= rows.length>1||!only ? rows.join('') : allDoneBox('همه‌ی بخش‌ها کامل شده‌اند 🎉');
  const mode=(S.ui.tMode==='topics')?'topics':'sessions';
  const tabs=`<div class="subtabs">
      <button class="chiptab ${mode==='sessions'?'on':''}" data-act="tmode" data-m="sessions">🗓️ مسیر جلسه‌ها</button>
      <button class="chiptab ${mode==='topics'?'on':''}" data-act="tmode" data-m="topics">📚 همه‌ی موضوع‌ها</button>
    </div>`;
  el('view-topics').innerHTML= tabs + (mode==='sessions' ? renderSessions() :
    (`<p class="sub" style="margin:2px 4px 10px">موضوعی را انتخاب کنید. لازم نیست همه را همین حالا جواب بدهید؛ هر وقت خواستید برگردید.</p>`+
     filterBar('بخش‌های کامل‌شده پنهان‌اند')+body));
}
function finaleProg(){ let a=0; FINALE.forEach((_,i)=>{if(S.finale['f'+(i+1)])a++;}); return fmt(a)+'/'+fmt(FINALE.length); }
function topicRow(t,isCustom){
  const done=t.answered>=t.total&&t.total>0; const w=t.total?Math.round(t.answered/t.total*100):0;
  const badge=isCustom?`<span class="tag">اختیاری</span>`:'';
  return `<button class="trow ${done?'donez':''}" data-act="open" data-topic="${t.id}">
    <span class="ic">${t.icon}</span>
    <span class="tt"><b>${t.title} ${badge}</b><span class="bar"><i style="width:${w}%"></i></span></span>
    <span class="pr">${done?'✓ ':''}${fmt(t.answered)}/${fmt(t.total)}</span>

}

  if(id==='finale'){
    const only=S.ui.qFilter==='un';
    const cards=FINALE.map((text,i)=>({text,i})).filter(x=> !only || !S.finale['f'+(x.i+1)] ).map(({text,i})=>{ const fid='f'+(i+1); const on=!!S.finale[fid];
      return `<div class="qcard ${on?'done':''}" id="q_${fid}">

  /* ---- تب‌بندی پله‌ها ---- */
  const maxTab = S.intStep3?3:(S.intStep2?2:1);

  const chips=`<div class="subtabs inttabs">`+[1,2,3].filter(k=>k<=maxTab).map(k=>{ const stp=intStepStat(k);

  const headFor = (tab===1) ? head + guide : `<div class="card" style="padding:13px 15px">

      <div class="btnrow">
        <button class="btn rose sm" data-act="intjump">⤵︎ اولین پرسش بی‌پاسخ</button>
        <span class="small" style="align-self:center">${fmt(intStepStat(tab).done)}/${fmt(intStepStat(tab).total)} پرسش این پله</span>
      </div></div>`;
  return chips + headFor + filterBar() + top + cards + tail + `<div class="btnrow" style="margin-top:2px">
      <button class="btn ghost sm" data-act="clearint">پاک‌کردن پاسخ‌های این بخش</button>
      <button class="btn green sm" data-act="tab" data-t="results">دیدن نتیجه</button></div>`;
}

const MBTI_POLE={E:'اهل جمع و گفت‌وگو',I:'درون‌گرا و اهل تأمل',S:'واقع‌گرا و اهل جزئیات',N:'کل‌نگر و ایده‌پرداز',
  T:'منطق‌محور در تصمیم',F:'احساس‌محور در تصمیم',J:'منظم و برنامه‌ریز',P:'منعطف و خودجوش'};
const ATT_DESC={'ایمن':'راحت با نزدیکی و اعتماد؛ هم به خود متکی است هم به شریک.',
  'مضطرب':'به نزدیکی زیاد و اطمینان مکرر نیاز دارد؛ از فاصله و طرد نگران می‌شود.',
  'اجتنابی':'به استقلال و فضای شخصی زیاد نیاز دارد؛ از صمیمیت بیش از حد فاصله می‌گیرد.',
  'هراسان':'هم‌زمان مشتاق نزدیکی و نگران آسیب است؛ بین «بیا» و «برو» نوسان دارد.'};

function personalityResultsHTML(){
  const pa=persProgressAll(); if(!pa.a && !pa.b) return '';
  let html=`<p class="sub">مقایسه‌ی ${esc(nameA())} و ${esc(nameB())} در چهار آزمون، همراه با نکات یک مشاور. بخش‌هایی که هنوز کامل نشده‌اند نمایش داده نمی‌شوند.</p>`;
  const growth=[]; const strengthsG=[];

  /* ---- MBTI ---- */
  const ma=mbtiScore('a'), mb=mbtiScore('b');
  if(ma&&mb){
    let shared=0; ['EI','SN','TF','JP'].forEach(k=>{if(ma.letter[k]===mb.letter[k])shared++;});
    html+=`<div style="margin:6px 0 4px"><b style="font-size:14px">🧭 تیپ شخصیتی (MBTI)</b></div>
      <div class="typebadges">
        <div class="tbadge a"><div class="who">${esc(nameA())}</div><div class="code">${ma.code}</div><div class="desc">${mbtiPhrase(ma.letter)}</div></div>
        <div class="tbadge b"><div class="who">${esc(nameB())}</div><div class="code">${mb.code}</div><div class="desc">${mbtiPhrase(mb.letter)}</div></div></div>
      <p class="small" style="text-align:center">${fmt(shared)} حرف از ۴ حرف مشترک است.</p>`;
    const diffs=['EI','SN','TF','JP'].filter(k=>ma.letter[k]!==mb.letter[k]);
    if(!diffs.length){ html+=advice('نقطه‌ی قوت','هر چهار محور یکسان است؛ سبک انرژی، ادراک، تصمیم‌گیری و نظم شما بسیار شبیه هم است. این یعنی جهان را نزدیک به هم می‌بینید. مراقب باشید شباهت زیاد گاهی نقاط کور مشترک می‌سازد.');
      strengthsG.push('نگاه و سبک زندگی بسیار نزدیک (MBTI کاملاً مشترک)'); }
    else { diffs.forEach(k=>{ html+=advice('تفاوت در '+mbtiAxisName(k), mbtiAxisNote(k)); });
      if(diffs.length>=3) growth.push('تفاوت شخصیتی چشمگیر در MBTI؛ نیازمند درک سبک متفاوت یکدیگر'); }
  }

  /* ---- Big Five ---- */
  const ba=big5Score('a'), bb=big5Score('b');
  if(ba._n && bb._n){
    html+=`<div style="margin:14px 0 6px"><b style="font-size:14px">🌱 پنج عامل بزرگ</b></div>
      <div class="plegend"><span><i style="background:var(--green)"></i>${esc(nameA())}</span><span><i style="background:var(--gold)"></i>${esc(nameB())}</span></div>`;
    Object.keys(DIMS_BIG).forEach(d=>{ const D=DIMS_BIG[d]; const a=ba[d], b=bb[d];
      const pos=v=>((v-1)/4*100).toFixed(0); const diff=(a!=null&&b!=null)?Math.abs(a-b):null;
      html+=`<div class="spec"><div class="st"><span>${D.title}</span>
          <span class="small">${a!=null?esc(nameA())+' '+fmt1(a):''}${(a!=null&&b!=null)?' · ':''}${b!=null?esc(nameB())+' '+fmt1(b):''}</span></div>
          <div class="ends"><span>${D.lo}</span><span>${D.hi}</span></div>
          <div class="track">${a!=null?`<span class="pdot a" style="inset-inline-start:${pos(a)}%"></span>`:''}${b!=null?`<span class="pdot b" style="inset-inline-start:${pos(b)}%"></span>`:''}</div></div>`;
    });
    const gaps=[]; Object.keys(DIMS_BIG).forEach(d=>{ if(ba[d]!=null&&bb[d]!=null){const g=Math.abs(ba[d]-bb[d]); if(g>=1.5)gaps.push({d,g});} });
    gaps.sort((x,y)=>y.g-x.g);
    if(gaps.length){ gaps.forEach(g=>{ html+=advice('فاصله در '+DIMS_BIG[g.d].title, big5Note(g.d), true); growth.push('فاصله‌ی قابل‌توجه در «'+DIMS_BIG[g.d].title+'»'); }); }
    else { html+=advice('نقطه‌ی قوت','در هر پنج بُعد به هم نزدیک‌اید؛ ریتم روزمره، نظم و واکنش‌های هیجانی‌تان احتمالاً کم‌تنش خواهد بود.'); strengthsG.push('پروفایل بیگ‌فایو نزدیک و کم‌اصطکاک'); }
  }

  /* ---- Attachment ---- */
  const aa=attachScore('a'), ab=attachScore('b');
  if(aa&&ab&&aa.style!=='—'&&ab.style!=='—'){
    html+=`<div style="margin:14px 0 6px"><b style="font-size:14px">🪢 سبک دلبستگی</b></div>
      <div class="quad">
        <div class="qx"></div><div class="qy"></div>
        <span class="ql tr">مضطرب</span><span class="ql tl">هراسان</span><span class="ql br">ایمن</span><span class="ql bl">اجتنابی</span>
        <span class="axl top">اضطراب بالا</span><span class="axl bot">اضطراب پایین</span><span class="axl rgt">اجتناب کم</span><span class="axl lft">اجتناب زیاد</span>
        <span class="qdot a" style="left:${(100-((aa.avo-1)/4*100)).toFixed(0)}%; top:${(100-((aa.anx-1)/4*100)).toFixed(0)}%"></span>
        <span class="qdot b" style="left:${(100-((ab.avo-1)/4*100)).toFixed(0)}%; top:${(100-((ab.anx-1)/4*100)).toFixed(0)}%"></span>
      </div>
      <div class="styleline"><span class="nm" style="color:var(--green)">${esc(nameA())}:</span> <span class="st">${aa.style}</span> — <span class="small">${ATT_DESC[aa.style]}</span></div>
      <div class="styleline"><span class="nm" style="color:#8A6D1E">${esc(nameB())}:</span> <span class="st">${ab.style}</span> — <span class="small">${ATT_DESC[ab.style]}</span></div>`;
    const pair=attachPair(aa.style,ab.style);
    html+=advice(pair.warn?'نکته‌ی مهم':'ارزیابی', pair.text, pair.warn);
    if(pair.warn) growth.push(pair.flag); else strengthsG.push(pair.flag);
  }

  /* ---- Love Languages ---- */
  const la=loveScore('a'), lb=loveScore('b');
  if(la._n && lb._n && la._ranked.length && lb._ranked.length){
    html+=`<div style="margin:14px 0 6px"><b style="font-size:14px">💞 زبان‌های عشق</b></div>
      <div class="lovebars">${Object.keys(LOVE_LABELS).map(k=>{ const a=la[k], b=lb[k];
        return `<div class="lg"><div class="lh"><b>${LOVE_LABELS[k]}</b><span class="small">${a!=null?fmt1(a):'—'} · ${b!=null?fmt1(b):'—'}</span></div>
          <div class="lr"><span class="a" style="width:${a!=null?((a-1)/4*100).toFixed(0):0}%"></span></div>
          <div class="lr" style="margin-top:3px"><span class="b" style="width:${b!=null?((b-1)/4*100).toFixed(0):0}%"></span></div></div>`;}).join('')}</div>
      <p class="small">زبان اصلی ${esc(nameA())}: <b>${LOVE_LABELS[la._ranked[0]]}</b>${la._ranked[1]?'، سپس '+LOVE_LABELS[la._ranked[1]]:''} · زبان اصلی ${esc(nameB())}: <b>${LOVE_LABELS[lb._ranked[0]]}</b>${lb._ranked[1]?'، سپس '+LOVE_LABELS[lb._ranked[1]]:''}</p>`;
    if(la._ranked[0]===lb._ranked[0]){ html+=advice('نقطه‌ی قوت','زبان اصلی محبت هر دو یکی است ('+LOVE_LABELS[la._ranked[0]]+'). یعنی به‌طور طبیعی همان‌طور محبت می‌کنید که دیگری دوست دارد دریافت کند.'); strengthsG.push('زبان اصلی عشق مشترک'); }
    else { html+=advice('نکته‌ی کاربردی','زبان محبت شما متفاوت است: '+esc(nameA())+' بیشتر با «'+LOVE_LABELS[la._ranked[0]]+'» و '+esc(nameB())+' با «'+LOVE_LABELS[lb._ranked[0]]+'» محبت را حس می‌کند. خطر اینجاست که هرکس به زبانِ خودش محبت کند و دیگری آن را کامل حس نکند. تمرین کنید محبت را به زبانِ دیگری ابراز کنید.', true); growth.push('تفاوت در زبان اصلی عشق؛ نیازمند ترجمه‌ی محبت به زبان دیگری'); }
  }

  /* ---- سبک حل تعارض ---- */
  const ca=dimScore('conflict','a',CONF_LABELS), cb=dimScore('conflict','b',CONF_LABELS);
  if(ca._n&&cb._n){
    html+=`<div style="margin:14px 0 6px"><b style="font-size:14px">⚡ سبک حل تعارض</b></div>
      <div class="lovebars">${Object.keys(CONF_LABELS).map(k=>`<div class="lg">
        <div class="lh"><b>${CONF_LABELS[k]}</b><span class="small">${ca[k]!=null?fmt1(ca[k]):'—'} · ${cb[k]!=null?fmt1(cb[k]):'—'}</span></div>
        <div class="lr"><span class="a" style="width:${ca[k]!=null?((ca[k]-1)/4*100).toFixed(0):0}%"></span></div>
        <div class="lr" style="margin-top:3px"><span class="b" style="width:${cb[k]!=null?((cb[k]-1)/4*100).toFixed(0):0}%"></span></div></div>`).join('')}</div>
      <p class="small">سبک غالب ${esc(nameA())}: <b>${CONF_LABELS[ca._ranked[0]]}</b> · سبک غالب ${esc(nameB())}: <b>${CONF_LABELS[cb._ranked[0]]}</b></p>`;
    const pair=ca._ranked[0]+'|'+cb._ranked[0];
    if(ca._ranked[0]==='avoid'&&cb._ranked[0]==='avoid')
      html+=advice('هر دو اجتنابی','هیچ‌کدام‌تان تعارض را باز نمی‌کنید. رابطه آرام به نظر می‌رسد ولی دلخوری‌ها روی هم انباشته می‌شوند و یک روز با یک جرقه‌ی کوچک منفجر می‌شوند. عمداً برای مسائل مهم وقت بگذارید، حتی وقتی هیچ دعوایی در کار نیست.',true);
    else if(ca._ranked[0]==='comp'&&cb._ranked[0]==='comp')

    else if((ca._ranked[0]==='comp'&&cb._ranked[0]==='accom')||(ca._ranked[0]==='accom'&&cb._ranked[0]==='comp'))

    else if((ca._ranked[0]==='comp'&&cb._ranked[0]==='avoid')||(ca._ranked[0]==='avoid'&&cb._ranked[0]==='comp'))
      html+=advice('یکی پیگیر، یکی گریزان','کلاسیک‌ترین چرخه: هرچه یکی بیشتر پیگیری می‌کند، دیگری بیشتر عقب می‌کشد. راه‌حلش این است که پیگیر مهلت بدهد و گریزان قول بدهد حتماً برگردد — وقفه‌ی زمان‌دار، نه فرار بی‌پایان.',true);
    else if(ca._ranked[0]==='coll'||cb._ranked[0]==='coll')
      html+=advice('نقطه‌ی قوت','دست‌کم یکی از شما سبک همکارانه دارد؛ همان کسی است که می‌تواند گفت‌وگو را از حالت برد‑باخت دربیاورد. این توانایی را جدی بگیرید و در دعواهای مهم از آن استفاده کنید.');
  }

  /* ---- باورهای مالی ---- */
  const ma2=dimScore('money','a',MONEY_LABELS), mb2=dimScore('money','b',MONEY_LABELS);
  if(ma2._n&&mb2._n){
    html+=`<div style="margin:14px 0 6px"><b style="font-size:14px">💰 باورهای مالی</b></div>
      <div class="lovebars">${Object.keys(MONEY_LABELS).map(k=>`<div class="lg">
        <div class="lh"><b>${MONEY_LABELS[k]}</b><span class="small">${ma2[k]!=null?fmt1(ma2[k]):'—'} · ${mb2[k]!=null?fmt1(mb2[k]):'—'}</span></div>
        <div class="lr"><span class="a" style="width:${ma2[k]!=null?((ma2[k]-1)/4*100).toFixed(0):0}%"></span></div>
        <div class="lr" style="margin-top:3px"><span class="b" style="width:${mb2[k]!=null?((mb2[k]-1)/4*100).toFixed(0):0}%"></span></div></div>`).join('')}</div>
      <p class="small">الگوی غالب ${esc(nameA())}: <b>${MONEY_LABELS[ma2._ranked[0]]}</b> · الگوی غالب ${esc(nameB())}: <b>${MONEY_LABELS[mb2._ranked[0]]}</b></p>`;
    const gap=Object.keys(MONEY_LABELS).filter(k=>ma2[k]!=null&&mb2[k]!=null&&Math.abs(ma2[k]-mb2[k])>=1.5);
    if(gap.length) html+=advice('فاصله در '+gap.map(k=>MONEY_LABELS[k]).join(' و '),'این تفاوت‌ها معمولاً خودشان را نه در حرف، که سرِ خرج‌های روزمره نشان می‌دهند. پیش از ازدواج یک بودجه‌ی مشترک بنویسید و سقف خرجِ بدون مشورت را مشخص کنید؛ همین دو کار جلوی بیشتر دعواهای مالی را می‌گیرد.',true);
    if(ma2._ranked[0]==='avoid'||mb2._ranked[0]==='avoid')
      html+=advice('اجتناب از پول','یکی از شما ترجیح می‌دهد با پول روبه‌رو نشود. این الگو معمولاً به بدهی پنهان و غافلگیری‌های ناخوشایند ختم می‌شود. توافق کنید ماهی یک‌بار، بیست دقیقه، با هم به حساب‌ها نگاه کنید — کوتاه و بدون سرزنش.',true);
  }

  /* ---- هوش ---- */
  const qa2=iqScore('a'), qb2=iqScore('b');
  if(qa2.n||qb2.n){
    html+=`<div style="margin:14px 0 6px"><b style="font-size:14px">🧩 سنجش توانایی ذهنی</b></div>
      <div class="iqres">
        <div class="box"><div class="who">${esc(nameA())}</div><div class="sc">${qa2.n?fmt(qa2.c)+'/'+fmt(qa2.n):'—'}</div>
          ${qa2.pct!=null?`<span class="band ${iqBand(qa2.pct).c}" style="margin-top:4px">${fmt(qa2.pct)}٪ · ${iqBand(qa2.pct).t}</span>`:''}</div>
        <div class="box b"><div class="who">${esc(nameB())}</div><div class="sc">${qb2.n?fmt(qb2.c)+'/'+fmt(qb2.n):'—'}</div>
          ${qb2.pct!=null?`<span class="band ${iqBand(qb2.pct).c}" style="margin-top:4px">${fmt(qb2.pct)}٪ · ${iqBand(qb2.pct).t}</span>`:''}</div>
      </div>
      <p class="small" style="margin-top:6px">این آزمون کوتاه است و استاندارد‌سازی بالینی ندارد، پس عدد آن «آی‌کیو» نیست؛ فقط تصویری کلی از سبک حل مسئله‌ی هر کدام‌تان می‌دهد. تفاوت نمره هم معیار خوبی برای قضاوت درباره‌ی همدیگر نیست.</p>`;
    if(qa2.n>=10&&qb2.n>=10&&Math.abs(qa2.pct-qb2.pct)>=30)
      html+=advice('تفاوت سبک حل مسئله','فاصله‌ی نمره‌ها قابل‌توجه است. این به معنای «باهوش‌تر بودن» کسی نیست، ولی ممکن است سرعت تصمیم‌گیری و شیوه‌ی استدلال‌تان فرق کند. در تصمیم‌های مهم، به هم فرصت فکر کردن بدهید و انتظار نداشته باشید دیگری با همان سرعت شما به نتیجه برسد.',true);
  }

  /* ---- جمع‌بندی مشاور ---- */
  const done= (ma&&mb)&&(ba._n&&bb._n)&&(aa&&ab&&aa.style!=='—')&&(la._n&&lb._n);
  html+=`<div style="margin:16px 0 6px"><b style="font-size:14px">📌 نکات شخصیتی برای گفت‌وگو</b></div>
    <p class="small" style="margin:0 0 8px">این جمع‌بندی فقط از آزمون‌های شخصیت ساخته می‌شود و جایگزین درصد تفاهم پرسش‌ها و «موضوعات نیازمند گفت‌وگو» نیست.</p>`;
  let synth='';
  if(strengthsG.length) synth+='<b>نقاط قوت شما:</b> '+strengthsG.slice(0,3).join('؛ ')+'. ';
  if(growth.length) synth+='<b>حوزه‌های نیازمند کار آگاهانه:</b> '+growth.slice(0,4).join('؛ ')+'. ';
  if(!synth) synth='برای جمع‌بندی کامل، آزمون‌ها را برای هر دو نفر تکمیل کنید. ';
  const label= growth.length===0?'سازگاری قوی' : growth.length<=2?'سازگاری خوب با چند نکته' : 'سازگاری ممکن، نیازمند گفت‌وگوی جدی';
  const lbClass= growth.length===0?'hi':growth.length<=2?'mid':'lo';
  html+=`<div class="advice"><span class="band ${lbClass}" style="margin:0 0 8px">${label}</span><br>${synth}</div>
    <div class="hint-gold">هیچ ترکیب شخصیتی «محکوم به شکست» یا «تضمین‌شده» نیست. آنچه تعیین‌کننده است، آگاهی از تفاوت‌ها و توافق بر سر نحوه‌ی مدیریت آن‌هاست. اگر چند حوزه‌ی قرمز دارید، یک جلسه مشاوره‌ی پیش از ازدواج ارزشش را دارد.</div>`;
  if(!done) html+=`<p class="small" style="margin-top:8px">هنوز همه‌ی آزمون‌ها برای هر دو نفر کامل نشده؛ با تکمیل آن‌ها تحلیل دقیق‌تر می‌شود.</p>`;
  return rsec('🧠','تحلیل شخصیت و سازگاری',html);
}
function advice(h,body,warn){ return `<div class="advice ${warn?'warn':''}"><span class="h">${h}</span>${body}</div>`; }
function mbtiPhrase(letter){ return [MBTI_POLE[letter.EI],MBTI_POLE[letter.SN],MBTI_POLE[letter.TF],MBTI_POLE[letter.JP]].join(' · '); }
function mbtiAxisName(k){ return {EI:'انرژی (برون‌گرا/درون‌گرا)',SN:'ادراک (حسی/شهودی)',TF:'تصمیم (منطق/احساس)',JP:'سبک زندگی (منظم/منعطف)'}[k]; }
function mbtiAxisNote(k){ return {
  EI:'یکی برای شارژ به جمع و معاشرت نیاز دارد و دیگری به تنهایی و آرامش. درباره‌ی مقدار مهمانی و رفت‌وآمد در برابر شب‌های دونفره و ساکت از قبل توافق کنید تا هیچ‌کدام سرخورده نشوید.',
  SN:'یکی روی واقعیت‌ها، جزئیات و «همین‌حالا» تمرکز دارد و دیگری روی تصویر کلی، معنا و آینده. در گفت‌وگوها مطمئن شوید منظور هم را دقیق فهمیده‌اید؛ این تفاوت می‌تواند مکمل باشد (یکی رؤیا می‌بافد، دیگری اجرایی‌اش می‌کند).',
  TF:'در تصمیم و حل اختلاف، یکی اول به منطق و انصاف فکر می‌کند و دیگری به احساسات آدم‌ها. اگر هر دو سبک دیگری را محترم بشمارید مکمل عالی‌اید؛ وگرنه یکی «سرد» و دیگری «غیرمنطقی» به نظر می‌رسد.',
  JP:'یکی برنامه، نظم و قطعیت می‌خواهد و دیگری انعطاف و خودجوشی. درباره‌ی نظم خانه، برنامه‌ریزی سفر و شیوه‌ی تصمیم‌گیری از قبل قاعده بگذارید تا این تفاوت به دعوای روزمره تبدیل نشود.'}[k]; }
function big5Note(d){ return {
  E:'فاصله در برون‌گرایی یعنی نیاز اجتماعی‌تان فرق دارد؛ ممکن است یکی مهمانی بخواهد و دیگری خانه. برای مقدار معاشرت و وقت تنهایی توافق صریح کنید.',
  A:'فاصله در توافق‌پذیری بر سبک دعوا اثر می‌گذارد؛ یکی ممکن است رک و رقابتی باشد و دیگری کوتاه‌آمدن‌طلب. قاعده‌ی «دعوای محترمانه» کمک می‌کند.',
  C:'فاصله در وظیفه‌شناسی شایع‌ترین منبع دعوای خانه است (نظم، برنامه، خرج). درباره‌ی تقسیم کار و استاندارد نظم شفاف توافق کنید.',
  S:'فاصله در ثبات هیجانی یعنی یکی زودتر مضطرب یا دلخور می‌شود. آن‌که آرام‌تر است می‌تواند لنگر باشد، به شرط آنکه احساسات دیگری را کوچک نشمارد.',
  O:'فاصله در گشودگی یعنی ذائقه‌ی تجربه و تغییرتان فرق دارد؛ یکی ماجراجویی می‌خواهد و دیگری روتین. برای سفر، سرگرمی و تغییرات زندگی به هم فضا بدهید.'}[d]; }
function attachPair(s1,s2){
  const set=[s1,s2].sort().join('|');
  const T={
    'ایمن|ایمن':{warn:false,flag:'هر دو دلبستگی ایمن (پایه‌ی بسیار محکم)',text:'هر دو سبک ایمن دارید؛ این قوی‌ترین پایه برای یک رابطه‌ی باثبات است. با نزدیکی و استقلال هر دو راحت‌اید و در تنش‌ها معمولاً سازنده عمل می‌کنید.'},
    'اجتنابی|ایمن':{warn:false,flag:'ترکیب ایمن و اجتنابی (قابل‌مدیریت)',text:'یک نفر ایمن است و دیگری اجتنابی. خبر خوب این است که شریک ایمن می‌تواند بدون فشار، امنیت لازم را فراهم کند. مراقب باشید نیاز به فاصله‌ی فرد اجتنابی، «بی‌مهری» تعبیر نشود.'},
    'ایمن|مضطرب':{warn:false,flag:'ترکیب ایمن و مضطرب (قابل‌مدیریت)',text:'یک نفر ایمن است و دیگری مضطرب. شریک ایمن با ثبات و اطمینان‌دادن می‌تواند اضطراب دیگری را کم کند. کلید کار، پاسخ‌دهی به‌موقع و پرهیز از سردی ناگهانی است.'},

/* ================= گزارش ================= */
function buildReport(){
  const st=stats(), L=[];
  L.push('گزارش آزمون تفاهم پیش از ازدواج — هم‌مسیر');
  L.push('تاریخ: '+todayFa()); L.push('زوج: '+nameA()+' و '+nameB());
  L.push('──────────────────────────');
  if(st.answered){
    L.push('نتیجه‌ی کلی پرسش‌ها: '+fmt(st.pct)+'٪ ('+bandOf(st.pct).t+') — پاسخ‌داده‌شده: '+fmt(st.answered)+' از '+fmt(st.total));
    L.push(''); L.push('به تفکیک موضوع:');
    st.per.filter(t=>t.total>0).forEach(t=>L.push('• '+t.title+': '+(t.answered?fmt(t.pct)+'٪':'بدون پاسخ')+' ('+fmt(t.answered)+'/'+fmt(t.total)+')'));
    L.push('');
    if(st.flags.length){ L.push('پرسش‌های نیازمند گفت‌وگو (نمره ۱ یا ۲):'); st.flags.forEach((f,i)=>L.push(fmt(i+1)+'. ['+f.topic+'] '+f.text+' — نمره '+fmt(f.v))); }
    else L.push('هیچ پرسشی نمره‌ی ۱ یا ۲ نگرفته است.');
    { const sk=[]; activeTopics().forEach(t=>t.qs.forEach(q=>{ if(aSkip(q.id)) sk.push('['+t.title+'] '+q.text); }));
      if(S.intimacyEnabled) intimacyQs().forEach(q=>{ if(aSkip(q.id)) sk.push('[زناشویی] '+q.text); });
      if(sk.length){ L.push(''); L.push('برای بعد گذاشته‌اید ('+fmt(sk.length)+' پرسش — بدون رنگ هشدار؛ هر وقت آماده بودید):');
        sk.forEach((x,i)=>L.push(fmt(i+1)+'. '+x)); } }
  } else L.push('هنوز به پرسشی پاسخ داده نشده است.');
  { const fd=FINALE.filter((_,i)=>S.finale['f'+(i+1)]).length;
    if(fd) L.push('حسن ختام (بدون نمره): '+fmt(fd)+' از '+fmt(FINALE.length)+' گفت‌وگو انجام شد.'); }

  if(S.intimacyEnabled){ const ist=intimacyStats(); if(ist.answered){
    L.push(''); L.push('سوالات زناشویی: '+fmt(ist.pct)+'٪ — '+fmt(ist.answered)+'/'+fmt(ist.total)); } }

  const pa=persProgressAll();
  if(pa.a||pa.b){
    L.push(''); L.push('— تحلیل شخصیت —');
    const ma=mbtiScore('a'),mb=mbtiScore('b');
    if(ma&&mb) L.push('MBTI: '+nameA()+' = '+ma.code+' | '+nameB()+' = '+mb.code);
    const ba=big5Score('a'),bb=big5Score('b');
    if(ba._n&&bb._n){ L.push('بیگ‌فایو (میانگین ۱ تا ۵):'); Object.keys(DIMS_BIG).forEach(d=>L.push('  • '+DIMS_BIG[d].title+': '+nameA()+' '+(ba[d]!=null?fmt1(ba[d]):'—')+' | '+nameB()+' '+(bb[d]!=null?fmt1(bb[d]):'—'))); }
    const aa=attachScore('a'),ab=attachScore('b');
    if(aa&&ab&&aa.style!=='—'&&ab.style!=='—') L.push('دلبستگی: '+nameA()+' = '+aa.style+' | '+nameB()+' = '+ab.style);
    const ia=iqScore('a'), ib=iqScore('b');
    if(ia.n||ib.n) L.push('سنجش توانایی ذهنی: '+nameA()+' '+fmt(ia.c)+'/'+fmt(ia.n)+' | '+nameB()+' '+fmt(ib.c)+'/'+fmt(ib.n));
    const ca2=dimScore('conflict','a',CONF_LABELS), cb2=dimScore('conflict','b',CONF_LABELS);
    if(ca2._ranked.length&&cb2._ranked.length) L.push('سبک حل تعارض: '+nameA()+' = '+CONF_LABELS[ca2._ranked[0]]+' | '+nameB()+' = '+CONF_LABELS[cb2._ranked[0]]);
    const na=dimScore('money','a',MONEY_LABELS), nb=dimScore('money','b',MONEY_LABELS);
    if(na._ranked.length&&nb._ranked.length) L.push('باورهای مالی: '+nameA()+' = '+MONEY_LABELS[na._ranked[0]]+' | '+nameB()+' = '+MONEY_LABELS[nb._ranked[0]]);
    const la=loveScore('a'),lb=loveScore('b');
    if(la._ranked&&la._ranked.length&&lb._ranked&&lb._ranked.length) L.push('زبان عشق: '+nameA()+' = '+LOVE_LABELS[la._ranked[0]]+' | '+nameB()+' = '+LOVE_LABELS[lb._ranked[0]]);
  }
  { const W=weightedStats();
    if(W.overall!=null){ L.push(''); L.push('— تفاهم به تفکیک اهمیت —');
      L.push('تفاهم وزنی کل: '+fmt(W.overall)+'٪');
      W.tiers.forEach(x=>{ if(x.n) L.push('• '+x.label+': '+fmt(x.pct)+'٪ از '+fmt(x.n)+' پرسش'); }); } }
  { const fs=(bankLeft()===0)?gapFindings():[];
    if(fs.length){ L.push(''); L.push('— شکاف اصل و اجرا —');
      fs.forEach(f=>{ L.push('• '+f.c.title+' (اصل '+fmt1(f.pm)+' / اجرا '+fmt1(f.cm)+')');
        f.lows.forEach(id=>{ const r=qTextOf(id); if(r) L.push('   ↩︎ '+r.q.text+' — نمره '+fmt(aVal(id))); }); }); }
    const sc=(bankLeft()===0)?skipClusters():[];
    if(sc.length){ L.push(''); L.push('بخش‌هایی که بیش از یک‌سوم پرسش‌هایشان برای بعد مانده:');
      sc.forEach(x=>L.push('• '+x.t.title+': '+fmt(x.sk)+' از '+fmt(x.t.qs.length))); } }
  L.push(''); L.push('یادآوری: این گزارش ابزاری برای گفت‌وگوی شفاف است و جایگزین مشاوره‌ی تخصصی پیش از ازدواج نیست.');
  return L.join('\n');
}
function download(name,text,mime){ try{ const blob=new Blob(['\ufeff'+text],{type:mime||'text/plain;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); return true; }catch(e){return false;} }
async function copyText(t){ try{await navigator.clipboard.writeText(t);return true;}catch(e){
    try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;}catch(e2){return false;} } }

function clearTopicAnswers(id){ askConfirm('پاسخ‌های این بخش پاک شود؟',()=>{
    const t=activeTopics().find(x=>x.id===id); if(t)t.qs.forEach(q=>{delete S.answers[q.id];});
    scheduleSave(); renderTopicDetail(id); updateHeader(); toast('پاک شد'); }); }
function clearTest(id){ askConfirm('پاسخ‌های این آزمون پاک شود؟',()=>{
    TESTS[id].items.forEach(it=>{delete S.pers[it.id];}); scheduleSave(); renderPersonality(); toast('پاک شد'); }); }

/* ================= توست و مودال ================= */
let toastTimer=null;
function toast(msg){ const t=el('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2100); }
let modalCb=null;
function askConfirm(msg,cb){ modalCb=cb; el('modalMsg').textContent=msg; el('modal').classList.add('show'); }
function askConfirmHTML(html,cb){ modalCb=cb; el('modalMsg').innerHTML=html; el('modal').classList.add('show'); }
function closeModal(){ el('modal').classList.remove('show'); modalCb=null; }
function updateHeader(){ const st=stats(); el('hprog').textContent=fmt(st.answered)+' / '+fmt(st.total); }
function syncHeaderH(){ const h=document.querySelector('header'); if(!h)return;
  const px=Math.round(h.getBoundingClientRect().height);
  if(px>0) document.documentElement.style.setProperty('--hh', px+'px'); }
function watchHeader(){ syncHeaderH();
  try{ if(window.ResizeObserver){ new ResizeObserver(syncHeaderH).observe(document.querySelector('header')); } }catch(e){}
  window.addEventListener('resize',syncHeaderH);
  window.addEventListener('orientationchange',()=>setTimeout(syncHeaderH,150));
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(syncHeaderH).catch(()=>{});
  window.addEventListener('load',syncHeaderH); }
function softTop(){ try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); } }
function keepScroll(fn){ const y=window.pageYOffset||document.documentElement.scrollTop||0; fn();
  const back=()=>window.scrollTo(0,y);
  if(window.requestAnimationFrame) requestAnimationFrame(()=>requestAnimationFrame(back)); else back(); }
function refreshView(){
  const cur=['home','topics','topic','personality','intimacy','results','tools'].find(t=>document.querySelector('#view-'+t+'.active'));
  if(cur==='topic'){ if(currentTopic==='__safety')renderSafety(); else renderTopicDetail(currentTopic); }
  else if(cur==='home')renderHome();
  else if(cur==='topics')renderTopics();
  else if(cur==='personality')renderPersonality();
  else if(cur==='intimacy')renderIntimacy();
  else if(cur==='results')renderResults();
  else renderTools();
}

/* ================= رویدادها ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t)return; const a=t.dataset.act;
  if(a==='tab')go(t.dataset.t,{smooth:false});
  else if(a==='open')openTopic(t.dataset.topic);
  else if(a==='opens'){ currentTopic='__s'+t.dataset.n; renderSession(+t.dataset.n); go('topic'); }
  else if(a==='tmode'){ S.ui.tMode=t.dataset.m; scheduleSave(); renderTopics(); }
  else if(a==='sesend'){ const n=+t.dataset.n; if(!S.sesDone)S.sesDone={}; S.sesDone[n]=true; scheduleSave();
    go('home'); const nx=nextSession();
    toast(nx? 'جلسه‌ی '+fmt(n)+' بسته شد — جلسه‌ی بعدی: '+fmt(nx) : 'همه‌ی جلسه‌ها تمام شد 🎉'); }
  else if(a==='sesreopen'){ const n=+t.dataset.n; if(S.sesDone)delete S.sesDone[n]; scheduleSave(); renderSession(n); toast('جلسه دوباره باز شد'); }
  else if(a==='rate')setAnswer(t.dataset.q,+t.dataset.v);
  else if(a==='pers')setPers(t.dataset.p,t.dataset.w,+t.dataset.v);
  else if(a==='iq')setIq(t.dataset.p,t.dataset.w,+t.dataset.v,t);
  else if(a==='iqedit'){ const rec=S.pers[t.dataset.p]; if(rec){ delete rec[t.dataset.w];
      if(!rec.a&&!rec.b)delete S.pers[t.dataset.p]; } scheduleSave(); refreshPersChips(); redrawIq(t.dataset.p); }
  else if(a==='ptab'){S.ui.persTab=t.dataset.tab; scheduleSave(); renderPersonality();}
  else if(a==='intoggle')toggleIntimacy();
  else if(a==='continue'){ const topics=activeTopics();
    for(const tp of topics){ const q=tp.qs.find(x=>!aVal(x.id)&&!aSkip(x.id)); if(q){openTopic(tp.id,q.id);return;} }
    const fi=FINALE.findIndex((_,i)=>!S.finale['f'+(i+1)]);
    if(fi>=0){openTopic('finale','f'+(fi+1));return;}
    go('results'); toast('همه‌ی پرسش‌ها پاسخ داده شده 🎉'); }
  else if(a==='addq')addCustom();
  else if(a==='delq'){ const id=t.dataset.id; askConfirm('این پرسش حذف شود؟',()=>{
      S.custom=S.custom.filter(c=>c.id!==id); delete S.answers[id]; scheduleSave(); renderTopicDetail('custom'); updateHeader(); toast('حذف شد'); }); }
  else if(a==='fdone'){ const id=t.dataset.id;
    if(S.finale[id])delete S.finale[id]; else S.finale[id]=true; scheduleSave();
    const card=el('q_'+id); const on=!!S.finale[id];
    if(card)card.classList.toggle('done',on);
    t.className='btn sm '+(on?'green':'ghost'); t.textContent= on?'✓ گفت‌وگو کردیم':'گفت‌وگو کردیم؟';
    const tp=el('tprog'); if(tp&&currentTopic==='finale')tp.textContent=finaleProg(); }
  else if(a==='qfilt'){ const m=t.dataset.m||'all'; S.ui.qFilter=(m==='all'||S.ui.qFilter===m)?'all':m; scheduleSave();
    keepScroll(()=>{
      if(document.querySelector('#view-topic.active')&&currentTopic!=='__safety') renderTopicDetail(currentTopic);
      else if(document.querySelector('#view-topics.active')) renderTopics();
      else if(document.querySelector('#view-intimacy.active')) renderIntimacy();
      else renderTopics(); });
    toast(S.ui.qFilter==='un'?'فقط پرسش‌های بی‌پاسخ نشان داده می‌شود':S.ui.qFilter==='skip'?'فهرست «برای بعد» نشان داده می‌شود':'همه‌ی پرسش‌ها نشان داده می‌شود'); }
  else if(a==='skip')setSkip(t.dataset.q);
  else if(a==='theme'){ const m=t.dataset.m; S.theme=(m==='auto')?null:m; applyTheme(); scheduleSave();
    if(document.querySelector('#view-tools.active')) renderTools();
    toast(m==='auto'?'تم خودکار شد':(m==='dark'?'تم تیره شد':'تم روشن شد')); }
  else if(a==='guideok'){ S.guideSeen=true; scheduleSave(); renderHome(); toast('قوانین ثبت شد؛ مسیر خوبی داشته باشید 🌿'); }
  else if(a==='inttab'){ S.ui.intTab=+t.dataset.t; scheduleSave(); renderIntimacy(); softTop(); }
  else if(a==='int2ok'){ S.intStep2=true; S.ui.intTab=2; scheduleSave(); renderIntimacy(); softTop();
    toast('پله‌ی ۲ باز شد — تبش بالای صفحه ساخته شد'); }
  else if(a==='int3ok'){ S.intStep3=true; S.ui.intTab=3; scheduleSave(); renderIntimacy(); softTop();
    toast('پله‌ی ۳ باز شد — تبش بالای صفحه ساخته شد'); }
  else if(a==='intclose'){ const st=+t.dataset.s;
    askConfirm(st===2?'پله‌ی ۲ (و پله‌ی ۳) بسته شود؟ پاسخ‌هایتان محفوظ می‌ماند و هر وقت خواستید دوباره باز می‌شود.'
                     :'پله‌ی ۳ بسته شود؟ پاسخ‌هایتان محفوظ می‌ماند و هر وقت خواستید دوباره باز می‌شود.',()=>{
      if(st===2){ S.intStep2=false; S.intStep3=false; S.ui.intTab=1; } else { S.intStep3=false; S.ui.intTab=2; }
      scheduleSave(); renderIntimacy(); softTop();
      toast(st===2?'تب‌های پله‌ی ۲ و ۳ بسته شد':'تب پله‌ی ۳ بسته شد'); }); }
  else if(a==='intjump'){ const qs=intimacyQs();
    const maxT=S.intStep3?3:(S.intStep2?2:1); const tb=Math.min(Math.max(+(S.ui.intTab||1),1),maxT); const rg=intRange(tb);
    let target=null; for(let i=rg.a;i<rg.b;i++){ const id=qs[i].id; if(!aVal(id)&&!aSkip(id)){ target=id; break; } }
    if(!target){ toast('در این پله پرسش بی‌پاسخی نمانده'); return; }
    if((S.ui.qFilter||'all')==='skip'){ S.ui.qFilter='all'; scheduleSave(); renderIntimacy(); }
    setTimeout(()=>{ const c=el('q_'+target); if(c&&c.scrollIntoView)c.scrollIntoView({behavior:'smooth',block:'center'}); },60); }
  else if(a==='refreshres'){ renderResults(); toast('نتایج به‌روز شد'); }
  else if(a==='gsafety')openSafety();
  else if(a==='goq'){ S.ui.qFilter='all'; const qid=t.dataset.q;
    if(t.dataset.topic==='intimacy'){ const i=+String(qid).slice(4)-1;
      const need = i>=INT_STEP3_FROM?3 : (i>=INT_FRANK_FROM?2:1);
      if((need===2&&!S.intStep2)||(need===3&&!S.intStep3)){ toast('این پرسش در پله‌ای است که هنوز باز نشده'); return; }
      S.ui.intTab=need; scheduleSave(); renderIntimacy(); go('intimacy');
      setTimeout(()=>{ const c=el('q_'+qid); if(c&&c.scrollIntoView)c.scrollIntoView({behavior:'smooth',block:'center'}); },80); return; }
    S.ui.tMode='topics'; scheduleSave(); openTopic(t.dataset.topic,qid); }
  else if(a==='goskip'){ S.ui.qFilter='skip'; S.ui.tMode='topics'; scheduleSave(); openTopic(t.dataset.topic); toast('فهرست «برای بعد» این بخش'); }
  else if(a==='cleartopic')clearTopicAnswers(t.dataset.topic);
  else if(a==='cleartest')clearTest(t.dataset.test);
  else if(a==='clearint')askConfirm('پاسخ‌های سوالات زناشویی پاک شود؟ (پله‌های بازشده هم بسته می‌شوند)',()=>{
      intimacyQs().forEach(q=>{delete S.answers[q.id];}); S.intStep2=false; S.intStep3=false;
      scheduleSave(); renderIntimacy(); updateHeader(); toast('پاسخ‌های زناشویی پاک شد'); });
  else if(a==='savenow'){persist(); toast('ذخیره شد');}
  else if(a==='autofill')autofill();
  else if(a==='clearall')askConfirm('همه‌ی پاسخ‌های پرسش‌های اصلی و «حسن ختام» پاک شود؟ (آزمون‌های شخصیت و بخش زناشویی می‌ماند)',()=>{
      activeTopics().forEach(x=>x.qs.forEach(q=>{delete S.answers[q.id];})); S.finale={};
      scheduleSave(); updateHeader(); refreshView(); toast('پاسخ پرسش‌ها پاک شد'); });
  else if(a==='clearpersall')askConfirm('همه‌ی آزمون‌های شخصیت پاک شود؟',()=>{
      TEST_ORDER.forEach(id=>TESTS[id].items.forEach(it=>{delete S.pers[it.id];}));
      scheduleSave(); refreshView(); toast('آزمون‌های شخصیت پاک شد'); });
  else if(a==='clearintall')askConfirm('همه‌ی پاسخ‌های سوالات زناشویی پاک شود؟ (پله‌های بازشده هم بسته می‌شوند)',()=>{
      Object.keys(S.answers).forEach(k=>{ if(k.indexOf('int_')===0||k.indexOf('intp_')===0||k.indexOf('intf_')===0) delete S.answers[k]; });
      S.intStep2=false; S.intStep3=false;
      scheduleSave(); updateHeader(); refreshView(); toast('پاسخ‌های زناشویی پاک شد'); });
  else if(a==='resetall')askConfirm('همه‌چیز حذف و برنامه از نو شروع شود؟ این کار برگشت‌پذیر نیست.',async()=>{
      const th=S.theme; S=defaultState(); S.theme=th; await store.del(KEY); await persist();
      applyTheme(); renderNav(); updateHeader(); go('home'); toast('از نو شروع شد'); });
  else if(a==='export'){ const cp=JSON.parse(JSON.stringify(S)); delete cp.safety;
    Object.keys(cp.answers||{}).forEach(k=>{ if(k.indexOf('safety_')===0) delete cp.answers[k]; });
    const ok=download('hammaseer-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(cp,null,2),'application/json'); toast(ok?'فایل پشتیبان آماده شد (بدون بخش ایمنی)':'دانلود ممکن نشد؛ از کپی استفاده کنید'); }
  else if(a==='importbtn')el('importFile').click();
  else if(a==='report'){ const ok=download('gozaresh-tafahom.txt',buildReport()); toast(ok?'گزارش دانلود شد':'دانلود ممکن نشد؛ از کپی استفاده کنید'); }
  else if(a==='copyreport')copyText(buildReport()).then(ok=>toast(ok?'گزارش کپی شد':'کپی ممکن نشد'));
  else if(a==='modal-yes'){const cb=modalCb; closeModal(); if(cb)cb();}
  else if(a==='modal-no')closeModal();
});
document.addEventListener('input',e=>{
  if(e.target.id==='nameA'){S.names.a=e.target.value; scheduleSave();}
  if(e.target.id==='nameB'){S.names.b=e.target.value; scheduleSave();}
});
el('importFile').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; e.target.value='';
  if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ try{ const obj=JSON.parse(rd.result); if(!obj||typeof obj!=='object'||!obj.answers)throw new Error('bad');
      askConfirm('داده‌های فعلی با فایل پشتیبان جایگزین شود؟',()=>{ const d=defaultState();
        S={...d,...obj, names:{...d.names,...(obj.names||{})}, ui:{...d.ui,...(obj.ui||{})}, answers:obj.answers||{}, pers:obj.pers||{}, custom:Array.isArray(obj.custom)?obj.custom:[], finale:(obj.finale&&typeof obj.finale==='object')?obj.finale:{}, intimacyEnabled:!!obj.intimacyEnabled};
        delete S.mode; delete S.play; delete S.dare;
        applyMigrations(obj.v||1);
        scheduleSave(); renderNav(); updateHeader(); go('home'); toast('بازیابی انجام شد'); });
    }catch(err){toast('فایل پشتیبان معتبر نیست');} };
  rd.readAsText(f); });

/* ================= شروع ================= */
(async function init(){
  try{ const raw=await store.get(KEY);
    if(raw){ const obj=JSON.parse(raw);
      if(obj&&typeof obj==='object'){ const d=defaultState();
        S={...d,...obj, names:{...d.names,...(obj.names||{})}, ui:{...d.ui,...(obj.ui||{})}, answers:obj.answers||{}, pers:obj.pers||{}, custom:Array.isArray(obj.custom)?obj.custom:[], finale:(obj.finale&&typeof obj.finale==='object')?obj.finale:{}};
        // مهاجرت از نسخه‌ی قبلی: حالت skip → غیرفعال؛ اگر پاسخ زناشویی هست، فعال کن
        if(obj.mode==='skip'){S.intimacyEnabled=false;}
        else if(typeof obj.intimacyEnabled==='boolean'){S.intimacyEnabled=obj.intimacyEnabled;}
        else { const hasInt=Object.keys(S.answers).some(k=>k.indexOf('intp_')===0||k.indexOf('intf_')===0); S.intimacyEnabled=hasInt; }
        applyMigrations(obj.v||1);
      }
    }
  }catch(e){}
  if(!TEST_ORDER.includes(S.ui.persTab))S.ui.persTab='mbti';
  if(!S.ui.qFilter) S.ui.qFilter='all';
  if(!S.ui.intTab) S.ui.intTab=1;
  if(!S.safety||typeof S.safety!=='object') S.safety={a:false,b:false,privA:null,privB:null};
  if(!S.sesDone||typeof S.sesDone!=='object') S.sesDone={};
  delete S.mode; delete S.play; delete S.dare;
  applyTheme(); watchHeader();
  try{ if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
  renderNav(); updateHeader();
  const valid=['home','topics','personality','intimacy','results','tools'];
  let tab= valid.includes(S.ui.tab)?S.ui.tab:'home';
  if(tab==='intimacy'&&!S.intimacyEnabled)tab='home';
  go(tab);
})();
